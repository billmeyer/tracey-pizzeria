receivers:
  otlp:
    # HTTP only. Every producer in this workshop speaks OTLP/HTTP — the three
    # Node services via @opentelemetry/exporter-*-otlp-http, and the browser,
    # which has no gRPC option at all. A grpc block on 4317 would be a
    # listening port nothing ever connects to.
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        # No longer on the default path, but kept as the fallback.
        #
        # Browser exports now go through the dev server's /otlp proxy, which
        # makes them same-origin — so they need no CORS at all. This list only
        # matters if VITE_OTEL_COLLECTOR_URL is set to an absolute URL to post
        # straight at this port, bypassing the proxy. In that case it is
        # load-bearing again: an OTLP POST can never be a CORS "simple request"
        # (its content type is application/json or x-protobuf), so every export
        # preflights and fails without the origin listed here.
        #   :5173  `make run-frontend` pins this with --strictPort
        #   :5174  Vite's fallback, for anyone running `npm run dev` by hand
        #
        # RUM_ALLOWED_ORIGIN covers the remote case on that fallback path: when
        # the page is served from something other than localhost — an Instruqt
        # public hostname, a LAN address — that origin has to be listed here or
        # its preflights fail. Set it in .env, e.g.
        #   RUM_ALLOWED_ORIGIN=https://abc123.env.play.instruqt.com
        # Unset it defaults to the localhost entry above, so the duplicate is a
        # harmless no-op rather than an empty origin the receiver would reject.
        cors:
          allowed_origins:
            - "http://localhost:5173"
            - "http://localhost:5174"
            - "${env:RUM_ALLOWED_ORIGIN:-http://localhost:5173}"
          allowed_headers:
            - "*"

processors:
  # Health checks are pure noise here: Compose polls /healthz on all three
  # services every few seconds, and each poll produces a server span plus the
  # Express middleware spans beneath it. Left in, they bury the spans the
  # workshop actually cares about in the debug exporter's output.
  #
  # Two matchers because the healthcheck produces two kinds of span: the HTTP
  # server span, named "GET /healthz", and Express's request-handler span,
  # which carries http.route but is named "request handler - /healthz".
  #
  # This filter used to miss most of the volume, and could not have caught it:
  # the flood was `middleware - jsonParser` and `middleware - patched`, and the
  # first of those carries no http.route at all. Middleware layers are now
  # suppressed at the SDK instead (ignoreLayersType in each service's otel.ts),
  # which is both cheaper than filtering spans that should never have been
  # created and the only way to keep them out of the debug exporter — a
  # processor on the Datadog pipeline cannot do that.
  filter/healthz:
    error_mode: ignore
    traces:
      span:
        - 'attributes["http.route"] == "/healthz"'
        - 'name == "GET /healthz"'

  # Datadog's OTLP intake only accepts delta temporality for sums and
  # histograms, and the OTel default is cumulative — so without this every
  # metric export was rejected at the intake, which is why nothing showed up
  # under Metrics while traces and logs arrived fine.
  #
  # The primary fix is upstream of here: all three Node services now set
  # OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE=delta (compose.yaml and
  # the matching `make run-*` targets), which is strictly cheaper — the SDK
  # already holds the previous value, whereas this processor has to keep a copy
  # of every stream to subtract from.
  #
  # This stays anyway, and not only as a safety net for producers outside
  # compose. The SDK's delta selector deliberately leaves UpDownCounter and
  # ObservableUpDownCounter cumulative, so for those two instrument types this
  # processor is the only thing doing the conversion.
  #
  # No include/exclude list on purpose: everything convertible should be
  # converted, and gauges pass through untouched either way. State is per
  # stream, so the first export after a Collector restart produces no delta —
  # expect one missing interval, not a gap.
  cumulativetodelta:

# There is deliberately no `batch` processor here any more. Batching moved onto
# the exporter's sending_queue (see otlp_http/datadog below), which is where
# upstream is taking it — the processor predates the queue and sits in the wrong
# place for it. A processor batches *before* the queue, so a batch is assembled,
# handed to the queue, and then possibly split or retried as a unit it had no
# say in; queue batching assembles the batch at send time, per consumer, which
# is the only point that knows what is actually about to go on the wire.
#
# The practical consequence is one buffer instead of two. With both configured
# you pay the processor's timeout *and* the queue's flush_timeout before
# anything leaves, which is the latency nobody can ever account for.
exporters:
  debug:
    verbosity: detailed

  # Metrics get their own debug exporter at a lower verbosity. At `detailed` the
  # exporter prints every data point of every histogram, every bucket boundary
  # included — and because the reader exports on a 10s interval, idle histograms
  # like undici's http.client.request.duration are re-printed in full forever,
  # not just when a request happens. That one metric was most of the compose
  # log. `basic` collapses an export to a single count line, which is all the
  # metrics pipeline needs to prove it is alive; traces and logs keep the
  # detailed dump the workshop reads them by.
  debug/metrics:
    verbosity: basic

# ── Exercise 2.1 ── select the lines below, toggle comments once ──
#   # Datadog's OTLP intake, used only for browser RUM logs/spans.
#   otlp_http/datadog:
#     endpoint: https://otlp.${env:DD_SITE}

#     # Examples for specific signal paths:
# #    metrics_endpoint: https://otlp.${env:DD_SITE}/v1/metrics
# #    traces_endpoint: https://otlp.${env:DD_SITE}/v1/traces
# #    logs_endpoint: https://otlp.${env:DD_SITE}/v1/logs
#     headers:
#       dd-api-key: ${env:DD_API_KEY}

#     # Queue batching, tuned for a low latency floor with throughput coming from
#     # concurrency rather than from waiting longer.
#     #
#     # One queue serves all three pipelines, because sending_queue is per
#     # *exporter* and this one exporter is on traces, metrics and logs. Tuning a
#     # signal separately would mean a second exporter instance pointed at the
#     # same endpoint, which is worth doing only once a signal's volume actually
#     # demands different numbers.
#     sending_queue:
#       enabled: true

#       # Count items (spans, points, records), not requests. Everything below is
#       # in that unit, and `requests` — the default — would make min_size a count
#       # of upstream exports, which says nothing about payload size.
#       sizer: items

#       # Where the throughput actually comes from. A single consumer draining a
#       # queue serially is capped by round-trip time to the intake no matter how
#       # large the batches are; 16 gives 16 POSTs in flight against a remote
#       # endpoint whose latency dominates local work.
#       num_consumers: 16

#       # ~100k items of headroom, so a stall at the intake is absorbed rather
#       # than immediately felt upstream.
#       queue_size: 100000

#       # Backpressure rather than data loss. When the queue fills, the receiver
#       # blocks and OTLP producers see it; the alternative (false, the default)
#       # drops the overflow and reports it only in the exporter's own metrics,
#       # which is the kind of loss you discover a week later from a gap.
#       #
#       # Worth knowing for the workshop: this makes the Collector capable of
#       # slowing the app down. That is the correct trade for telemetry you intend
#       # to bill or alert on, and the wrong one for a best-effort debug feed.
#       block_on_overflow: true

#       batch:
#         # The latency floor: nothing waits longer than this, whatever the batch
#         # size. Replaces the old processor's 5s timeout, which was 25x this.
#         flush_timeout: 200ms

#         # Send as soon as this much has accumulated, without waiting out the
#         # timeout — so under load the 200ms ceiling is rarely reached and
#         # batches stay large enough to amortize the HTTP round trip.
#         min_size: 2000

#         # Payload cap. A batch larger than this is split rather than sent as one
#         # oversized POST the intake may reject outright.
#         max_size: 10000
# ── end Exercise 2.1 ──

service:
  pipelines:
    traces:
      receivers: [otlp]
      # filter/healthz is the only processor left. Dropping healthz spans here
      # still keeps them out of every batch downstream — the batch is now
      # assembled in the exporter, which is strictly after this.
      processors: [filter/healthz]
      exporters:
        - debug
        # ── Exercise 2.1 ── select the lines below, toggle comments once ──
        # - otlp_http/datadog
        # ── end Exercise 2.1 ──
    metrics:
      receivers: [otlp]
      # cumulativetodelta does its per-point work here, while the points are
      # still grouped by the export that produced them, and well before the
      # exporter's queue regroups them into send-sized batches.
      processors: [cumulativetodelta]
      exporters:
        # Active, like the traces and logs pipelines above, and that matters
        # for more than symmetry. The workshop's starting state comments out
        # the otlp_http/datadog exporter, and a pipeline whose only exporter
        # is commented out is an invalid config -- so the whole pipeline would
        # have to go with it, leaving every Node service POSTing metrics at an
        # endpoint that answers 404 every ten seconds. With `debug` here the
        # metrics pipeline survives the strip exactly the way traces and logs
        # do, and Chapter 01 is quiet.
        - debug/metrics
        # ── Exercise 2.1 ── select the lines below, toggle comments once ──
        # - otlp_http/datadog
        # ── end Exercise 2.1 ──
    logs:
      # No processors at all now that batching has moved to the exporter. An
      # empty stage is omitted rather than written as `processors: []`, which
      # the Collector accepts but which reads as a list someone forgot to fill.
      receivers: [otlp]
      exporters:
        - debug
        # ── Exercise 2.1 ── select the lines below, toggle comments once ──
        # - otlp_http/datadog
        # ── end Exercise 2.1 ──