receivers:
  otlp:
    # HTTP only. Every producer in this workshop speaks OTLP/HTTP — the three
    # Node services via @opentelemetry/exporter-*-otlp-http, and the browser,
    # which has no gRPC option at all. A grpc block on 4317 would be a
    # listening port nothing ever connects to.
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        # No longer on the default path, but kept as the fallback.
        #
        # Browser exports now go through the dev server's /otlp proxy, which
        # makes them same-origin — so they need no CORS at all. This list only
        # matters if VITE_OTEL_COLLECTOR_URL is set to an absolute URL to post
        # straight at this port, bypassing the proxy. In that case it is
        # load-bearing again: an OTLP POST can never be a CORS "simple request"
        # (its content type is application/json or x-protobuf), so every export
        # preflights and fails without the origin listed here.
        #   :5173  `make run-frontend` pins this with --strictPort
        #   :5174  Vite's fallback, for anyone running `npm run dev` by hand
        #
        # RUM_ALLOWED_ORIGIN covers the remote case on that fallback path: when
        # the page is served from something other than localhost — an Instruqt
        # public hostname, a LAN address — that origin has to be listed here or
        # its preflights fail. Set it in .env, e.g.
        #   RUM_ALLOWED_ORIGIN=https://abc123.env.play.instruqt.com
        # Unset it defaults to the localhost entry above, so the duplicate is a
        # harmless no-op rather than an empty origin the receiver would reject.
        cors:
          allowed_origins:
            - "http://localhost:5173"
            - "http://localhost:5174"
            - "${env:RUM_ALLOWED_ORIGIN:-http://localhost:5173}"
          allowed_headers:
            - "*"

processors:
  # Health checks are pure noise here: Compose polls /healthz on all three
  # services every few seconds, and each poll produces a server span plus the
  # Express middleware spans beneath it. Left in, they bury the spans the
  # workshop actually cares about in the debug exporter's output.
  #
  # Two matchers because the healthcheck produces two kinds of span: the HTTP
  # server span, named "GET /healthz", and Express's request-handler span,
  # which carries http.route but is named "request handler - /healthz".
  #
  # This filter used to miss most of the volume, and could not have caught it:
  # the flood was `middleware - jsonParser` and `middleware - patched`, and the
  # first of those carries no http.route at all. Middleware layers are now
  # suppressed at the SDK instead (ignoreLayersType in each service's otel.ts),
  # which is both cheaper than filtering spans that should never have been
  # created and the only way to keep them out of the debug exporter — a
  # processor on the Datadog pipeline cannot do that.
  filter/healthz:
    error_mode: ignore
    traces:
      span:
        - 'attributes["http.route"] == "/healthz"'
        - 'name == "GET /healthz"'

  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  debug:
    verbosity: detailed

  # Datadog's OTLP intake, used only for browser RUM logs/spans.
  otlp_http/datadog:
    endpoint: https://otlp.${env:DD_SITE}

    # Examples for specific signal paths:
#    metrics_endpoint: https://otlp.${env:DD_SITE}/v1/metrics
#    traces_endpoint: https://otlp.${env:DD_SITE}/v1/traces
#    logs_endpoint: https://otlp.${env:DD_SITE}/v1/logs
    headers:
      dd-api-key: ${env:DD_API_KEY}

service:
  pipelines:
    traces:
      receivers: [otlp]
      # filter before batch so dropped spans never take up room in a batch.
      processors: [filter/healthz, batch]
      exporters:
        - debug
        - otlp_http/datadog
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters:
        # Active, like the traces and logs pipelines above, and that matters
        # for more than symmetry. The workshop's starting state comments out
        # the otlp_http/datadog exporter, and a pipeline whose only exporter
        # is commented out is an invalid config -- so the whole pipeline would
        # have to go with it, leaving every Node service POSTing metrics at an
        # endpoint that answers 404 every ten seconds. With `debug` here the
        # metrics pipeline survives the strip exactly the way traces and logs
        # do, and Chapter 01 is quiet.
        - debug
        - otlp_http/datadog
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters:
        - debug
        - otlp_http/datadog